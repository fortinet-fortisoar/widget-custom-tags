  <form data-ng-submit="save()" class="noMargin" name="editTagsWidgetForm" data-ng-class="{'state-wait': processing }"
  novalidate>
  <div class="modal-header">
      <h3 class="modal-title col-md-9">Edit Custom tags</h3>
      <button type="button" class="close" data-ng-click="cancel()" data-dismiss="modal" aria-label="Close"
          id="close-edit-widget-form-btn">
          <div aria-hidden="true" class="version-button">+</div>
      </button>
  </div>
  <div class="modal-body">
    <div data-ng-if="!isConfigurable">
      <span class="ng-binding">{{viewWidgetVars.LABEL_NOT_CONFIGURABLE}}</span>
    </div>
      <div data-ng-if="isConfigurable">
        <div class="form-group" data-ng-class="{ 'has-error': editTagsWidgetForm.title.$invalid && editTagsWidgetForm.title.$touched }">
            <label for="title" class="control-label">{{'COMPONENTS.VIEW_TEMPLATES.WIDGETS.CHART.TITLE' | translate}}<span class="text-danger">*</span>
            </label>
            <input id="title" name="title" type="text" class="form-control" data-ng-model="config.title" required>
            <div data-cs-messages="editTagsWidgetForm.title"></div>
          </div>
        <div class="form-group"
          data-ng-class="{ 'has-error': editTagsWidgetForm.resourceModule.$invalid && editTagsWidgetForm.resourceModule.$touched }"
          data-ng-if="modules">
          <label for="resourceModule" class="control-label">{{'APP.LABEL.SELECT_A_MODULE' | translate}}<span class="text-danger">*</span></label>
          <select name="resourceModule" id="resourceModule" class="form-control"
            data-ng-options="module.type as module.name for module in modules" data-ng-model="config.resourceModule"
            required data-ng-change="loadAttributes()">
            <option value="">{{'APP.LABEL.SELECT_AN_OPTION' | translate}}</option>
          </select>
          <div data-cs-messages="editTagsWidgetForm.resourceModule"></div>
        </div>
        <div class="form-group dashed-border-section padding-md" data-ng-if="config.resourceModule" data-ng-repeat="item in config.includedTagsStructure">
          <div class="form-group"
          data-ng-class="{ 'has-error': editTagsWidgetForm.structure.$invalid && editTagsWidgetForm.structure.$touched }">
          <label for="structure" class="control-label">Tags Structure<span class="text-danger">*</span></label>
          <button type="button" data-ng-click="removeLayer($index)" id="removeLayer-{{ $index }}"
            class="btn-sm btn btn-link btn-delete-layer" data-ng-if="$index !== 0"> <span
              class="icon icon-close text-danger"></span>
          </button>
          <select name="structure" id="structure" class="form-control"
            data-ng-options="option for option in structureSupported" data-ng-model="item.structureSelected"
            required data-ng-change="changeStructure()">
            <option value="">{{'APP.LABEL.SELECT_AN_OPTION' | translate}}</option>
          </select>
          <div data-cs-messages="editTagsWidgetForm.resource"></div>
        </div>
        <div class="form-group">
            <label class="control-label" for="resourceField">{{'COMPONENTS.CODE_EDITOR.FIELD' | translate}} <span class="text-danger">*</span></label>
            <select class="form-control" name="resourceField" id="resourceField"
              data-ng-options="field.name as field.title for field in resourceField" ng-model="item.field" required>
              <option value="">{{'COMPONENTS.FILTER.CONDITIONAL.SELECT_A_FIELD' | translate}}</option>
            </select>
        </div>
        <!-- URL Code Block -->
        <div class="form-group" data-ng-if="item.structureSelected==='URL'"
          data-ng-class="{ 'has-error': editTagsWidgetForm.navigationModule.$invalid && editTagsWidgetForm.navigationModule.$touched }"
          data-ng-if="modules">
          <label for="navigationModule" class="control-label">Navigation Module<span class="text-danger">*</span></label>
          <select name="navigationModule" id="navigationModule" class="form-control"
            data-ng-options="module.type as module.name for module in modules" data-ng-model="config.navigationModule"
            required data-ng-change="loadAttributes()">
            <option value="">{{'APP.LABEL.SELECT_AN_OPTION' | translate}}</option>
          </select>
          <div data-cs-messages="editTagsWidgetForm.navigationModule"></div>
        </div>
        </div>
        <button type="button" id="edit-widget-add" data-ng-click="includeMoreTags()" class="btn btn-primary btn-sm margin-top-sm"><i class="icon icon-add margin-right-sm"></i>Include more tags</button>
      </div>
  </div>
  <div class="modal-footer">
    <button id="edit-widget-save" type="submit" class="btn btn-sm btn-primary" data-ng-if="!isConfigurable"><i
        class="icon icon-check margin-right-sm"></i>{{'APP.BUTTON.OK' | translate}}</button>
    <div data-ng-if="isConfigurable">
      <button id="edit-widget-save" type="submit" class="btn btn-sm btn-primary"><i
          class="icon icon-check margin-right-sm"></i>Save</button>
      <button id="edit-widget-cancel" type="button" class="btn btn-sm btn-default" data-ng-click="cancel()"><i
          class="icon icon-close margin-right-sm"></i>Close</button>
    </div>
  </div>
</form>
